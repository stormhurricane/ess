name: Scrape

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ess
        uses: actions/checkout@v4

      - name: Checkout ess-data
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ESS_DATA_REPO }}
          token: ${{ secrets.ESS_DATA_TOKEN }}
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache HTTP responses
        uses: actions/cache@v4
        with:
          path: .cache
          key: ess-http-${{ runner.os }}-v1
          restore-keys: |
            ess-http-${{ runner.os }}-

      - name: Run scraper
        run: >
          python main.py
          --config data/config.yaml
          --settings data/settings.json
          --output data/result.json
          --quiet

      - name: Commit and push result.json
        working-directory: data
        run: |
          git config user.name "ess-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.json
          if git diff --cached --quiet; then
            echo "No changes to result.json"
          else
            git commit -m "Update result.json"
            git push
          fi
